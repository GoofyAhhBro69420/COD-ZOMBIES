name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Create better py alias
        run: |
          cat > /usr/local/bin/py << 'EOF'
          #!/bin/bash
          # Ignore version flags like -3.11 and just run python
          while [[ $1 == -* ]]; do
            shift
          done
          exec python "$@"
          EOF
          chmod +x /usr/local/bin/py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run cloudflare:stage

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .work/cloudflare-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
